<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14212b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="METRIS">
  <title>METRIS</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app">
    <header class="topbar"><h1 id="title">METRIS</h1></header>
    <main id="main">
      <p id="boot" class="boot">Loading METRIS…</p>
      <section id="view-explore" class="view" hidden></section>
      <section id="view-area" class="view" hidden></section>
      <section id="view-compare" class="view" hidden></section>
      <section id="view-assistant" class="view" hidden></section>
      <section id="view-guide" class="view" hidden></section>
    </main>
    <nav id="tabs" class="tabs" aria-label="Sections"></nav>
  </div>
  <dialog id="legend" class="sheet" aria-labelledby="legend-title">
    <div class="sheet-head">
      <h2 id="legend-title">Legend</h2>
      <button type="button" class="btn small ghost" id="legend-close">Close</button>
    </div>
    <div id="legend-body"></div>
  </dialog>
  <noscript><p class="boot">METRIS needs JavaScript to run.</p></noscript>
  <script type="module" src="js/ui/app.js"></script>
</body>
</html>
